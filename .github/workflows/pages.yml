name: Pages

# The site is static HTML: no build step. Every push to main publishes the repository as it is.
# Project guides live in their own repositories at /<project>/, so this site uses / and /projects/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse em-dashes
        run: |
          if grep -rlP '\xe2\x80\x94' --include='*.html' .; then echo 'em-dash found'; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
